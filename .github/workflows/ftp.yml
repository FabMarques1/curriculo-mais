name: FTPUpload

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
      name: 🎉 AutoDesplegado
      runs-on: ubuntu-latest
      steps:
      - name: Enviando o código para o servidor
        uses: actions/checkout@v3
  
      - name: Deploy feito com sucesso!
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.servidor }}
          username: ${{ secrets.usuario }}
          password: ${{ secrets.senha }}
          server-dir: /htdocs/
          protocol: ftps
          port: 21 
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
